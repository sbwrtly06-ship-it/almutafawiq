name: Build AlMutafawiq APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable

      - name: Create Flutter project
        run: flutter create --org com.almutafawiq .

      - name: Write app code
        run: |
          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';

          void main() => runApp(const AlMutafawiqApp());

          class AlMutafawiqApp extends StatelessWidget {
            const AlMutafawiqApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'المتفوق',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFF6C3FD9),
                  ),
                  useMaterial3: true,
                ),
                home: const WelcomeScreen(),
              );
            }
          }

          class WelcomeScreen extends StatelessWidget {
            const WelcomeScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Directionality(
                textDirection: TextDirection.rtl,
                child: Scaffold(
                  body: SafeArea(
                    child: Padding(
                      padding: const EdgeInsets.all(24),
                      child: Column(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          const Icon(
                            Icons.school_rounded,
                            size: 110,
                            color: Color(0xFF6C3FD9),
                          ),
                          const SizedBox(height: 24),
                          const Text(
                            'المتفوق',
                            style: TextStyle(
                              fontSize: 40,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          const SizedBox(height: 12),
                          const Text(
                            'ركّز اليوم، واصنع مستقبلك',
                            style: TextStyle(fontSize: 18),
                          ),
                          const SizedBox(height: 45),
                          SizedBox(
                            width: double.infinity,
                            child: ElevatedButton(
                              onPressed: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) => const RegisterScreen(),
                                  ),
                                );
                              },
                              child: const Padding(
                                padding: EdgeInsets.all(16),
                                child: Text(
                                  'ابدأ رحلتك',
                                  style: TextStyle(fontSize: 18),
                                ),
                              ),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class RegisterScreen extends StatelessWidget {
            const RegisterScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Directionality(
                textDirection: TextDirection.rtl,
                child: Scaffold(
                  appBar: AppBar(title: const Text('إنشاء حساب')),
                  body: Padding(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      children: [
                        const TextField(
                          decoration: InputDecoration(
                            labelText: 'اسم الطالب',
                            border: OutlineInputBorder(),
                          ),
                        ),
                        const SizedBox(height: 16),
                        const TextField(
                          decoration: InputDecoration(
                            labelText: 'البريد الإلكتروني',
                            border: OutlineInputBorder(),
                          ),
                        ),
                        const SizedBox(height: 16),
                        const TextField(
                          obscureText: true,
                          decoration: InputDecoration(
                            labelText: 'كلمة المرور',
                            border: OutlineInputBorder(),
                          ),
                        ),
                        const SizedBox(height: 30),
                        ElevatedButton(
                          onPressed: () {},
                          child: const Text('متابعة'),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          DART

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: almutafawiq-apk
          path: build/app/outputs/flutter-apk/*.apk
