

name: Build AlMutafawiq APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android --org com.almutafawiq .

      - name: Set Android API 36
        run: |
          python3 - <<'PY2'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("ERROR: android/app/build.gradle.kts was not generated")

          s = p.read_text()

          s = s.replace(
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = 36"
          )
          s = s.replace(
              "targetSdk = flutter.targetSdkVersion",
              "targetSdk = 36"
          )

          p.write_text(s)
          print("Android compileSdk and targetSdk set to 36")
          PY2

          grep -n -E "compileSdk|targetSdk" android/app/build.gradle.kts

      - name: Add Accessibility blocking service
        run: |
          mkdir -p android/app/src/main/kotlin/com/almutafawiq/almutafawiq
          mkdir -p android/app/src/main/res/xml

          cat > android/app/src/main/kotlin/com/almutafawiq/almutafawiq/AppBlockAccessibilityService.kt <<'EOF'
          package com.almutafawiq.almutafawiq

          import android.accessibilityservice.AccessibilityService
          import android.content.pm.PackageManager
          import android.os.Handler
          import android.os.Looper
          import android.util.Log
          import android.view.accessibility.AccessibilityEvent

          class AppBlockAccessibilityService : AccessibilityService() {

              private val handler = Handler(Looper.getMainLooper())

              override fun onServiceConnected() {
                  super.onServiceConnected()

                  serviceInfo = serviceInfo.apply {
                      eventTypes =
                          AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED or
                          AccessibilityEvent.TYPE_WINDOWS_CHANGED

                      notificationTimeout = 50
                  }

                  Log.d("AlMutafawiqBlock", "SERVICE_CONNECTED")
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return

                  val eventPackage = event.packageName?.toString()

                  val activePackage = try {
                      rootInActiveWindow?.packageName?.toString()
                  } catch (_: Exception) {
                      null
                  }

                  val packageName = eventPackage ?: activePackage ?: return

                  checkBlockedApp(packageName)
              }

              private var lastBlockedPackage: String? = null

              private fun checkBlockedApp(packageName: String) {
                  if (packageName == applicationContext.packageName) {
                      lastBlockedPackage = null
                      return
                  }

                  val prefs =
                      getSharedPreferences("FlutterSharedPreferences", MODE_PRIVATE)

                  val focusActive =
                      prefs.getBoolean("flutter.focus_mode_active", false)

                  if (!focusActive) {
                      lastBlockedPackage = null
                      return
                  }

                  val blockedString =
                      prefs.getString("flutter.blocked_packages", "") ?: ""

                  val blockedPackages = blockedString
                      .split("|")
                      .map { it.trim() }
                      .filter { it.isNotEmpty() }
                      .toSet()

                  Log.d(
                      "AlMutafawiqBlock",
                      "CHECK package=$packageName focus=$focusActive blocked=$blockedPackages"
                  )

                  // عند الانتقال إلى تطبيق غير محظور نسمح بتسجيل
                  // محاولة جديدة لنفس التطبيق لاحقاً.
                  if (packageName !in blockedPackages) {
                      lastBlockedPackage = null
                      return
                  }

                  // Accessibility قد يرسل عدة أحداث لنفس عملية الفتح.
                  // نسجل المحاولة مرة واحدة فقط لكل فتح.
                  if (lastBlockedPackage == packageName) {
                      return
                  }

                  lastBlockedPackage = packageName

                  val appName = try {
                      packageManager.getApplicationLabel(
                          packageManager.getApplicationInfo(
                              packageName,
                              PackageManager.GET_META_DATA
                          )
                      ).toString()
                  } catch (_: Exception) {
                      packageName
                  }

                  val now = java.util.Calendar.getInstance()

                  val year = now.get(java.util.Calendar.YEAR)
                  val month = now.get(java.util.Calendar.MONTH) + 1
                  val day = now.get(java.util.Calendar.DAY_OF_MONTH)

                  val dateKey =
                      String.format(
                          java.util.Locale.US,
                          "%04d-%02d-%02d",
                          year,
                          month,
                          day
                      )

                  val attemptsKey =
                      "flutter.distraction_attempts_$dateKey"

                  val namesKey =
                      "flutter.distraction_names_$dateKey"

                  val currentAttempts =
                      prefs.getInt(attemptsKey, 0)

                  prefs.edit()
                      .putInt(
                          attemptsKey,
                          currentAttempts + 1
                      )
                      .apply()

                  val oldNames =
                      prefs.getStringSet(namesKey, emptySet())
                          ?.toMutableSet()
                          ?: mutableSetOf()

                  // نستخدم مفتاحاً فريداً لكل محاولة حتى لا تختفي
                  // المحاولات المتكررة لنفس التطبيق.
                  val attemptId =
                      "${System.currentTimeMillis()}|$packageName"

                  oldNames.add(
                      "$attemptId|$appName|$packageName"
                  )

                  prefs.edit()
                      .putStringSet(namesKey, oldNames)
                      .apply()

                  Log.d(
                      "AlMutafawiqBlock",
                      "DISTRACTION_ATTEMPT #" +
                          (currentAttempts + 1) +
                          " app=$appName package=$packageName"
                  )

                  Log.d(
                      "AlMutafawiqBlock",
                      "BLOCKING $packageName"
                  )

                  handler.post {
                      performGlobalAction(GLOBAL_ACTION_HOME)
                  }
              }

              override fun onInterrupt() {
                  Log.d("AlMutafawiqBlock", "SERVICE_INTERRUPTED")
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  super.onDestroy()
              }
          }
          EOF

          cat > android/app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowsChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="50"
              android:canRetrieveWindowContent="true"
              android:accessibilityFlags="flagDefault|flagReportViewIds|flagRetrieveInteractiveWindows" />
          EOF

      - name: Add Usage Access permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          text = text.replace(
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android" '
              'xmlns:tools="http://schemas.android.com/tools">'
          )

          queries = '''
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <package android:name="com.zhiliaoapp.musically" />
                  <package android:name="com.instagram.android" />
                  <package android:name="com.instagram.lite" />
                  <package android:name="com.snapchat.android" />
                  <package android:name="com.facebook.katana" />
                  <package android:name="com.facebook.lite" />
                  <package android:name="com.facebook.orca" />
                  <package android:name="com.google.android.youtube" />
                  <package android:name="com.whatsapp" />
                  <package android:name="org.telegram.messenger" />
                  <package android:name="com.twitter.android" />
              </queries>
          '''

          if "<queries>" not in text:
              text = text.replace(
                  'xmlns:tools="http://schemas.android.com/tools">',
                  'xmlns:tools="http://schemas.android.com/tools">\n' + queries,
                  1
              )

          permission = '''
              <uses-permission
                  android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />
              <uses-permission
                  android:name="android.permission.QUERY_ALL_PACKAGES" />
          '''

          if "PACKAGE_USAGE_STATS" not in text:
              text = text.replace(
                  '<application',
                  permission + '\n    <application'
              )

          service = '''
              <service
                  android:name=".AppBlockAccessibilityService"
                  android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.accessibilityservice.AccessibilityService" />
                  </intent-filter>
                  <meta-data
                      android:name="android.accessibilityservice"
                      android:resource="@xml/accessibility_service_config" />
              </service>
          '''

          if "AppBlockAccessibilityService" not in text:
              text = text.replace("</application>", service + "\n    </application>")

          path.write_text(text)
          PY

      - name: Add native Usage Access bridge
        run: |
          mkdir -p android/app/src/main/kotlin/com/almutafawiq/almutafawiq

          cat > android/app/src/main/kotlin/com/almutafawiq/almutafawiq/MainActivity.kt <<'EOF'
          package com.almutafawiq.almutafawiq

          import android.app.AppOpsManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.os.Process
          import android.provider.Settings
          import android.app.usage.UsageEvents
          import android.app.usage.UsageStatsManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {

              private val CHANNEL = "almutafawiq/usage"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      CHANNEL
                  ).setMethodCallHandler { call, result ->

                      when (call.method) {

                          "openUsageAccessSettings" -> {
                              try {
                                  val intent = Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS)
                                  startActivity(intent)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.error("SETTINGS_ERROR", e.message, null)
                              }
                          }

                          "hasUsageAccess" -> {
                              result.success(hasUsageAccess())
                          }

                          "getForegroundPackage" -> {
                              result.success(getForegroundPackage())
                          }

                          "bringAppToFront" -> {
                              try {
                                  val intent = packageManager.getLaunchIntentForPackage(packageName)
                                  if (intent != null) {
                                      intent.addFlags(
                                          Intent.FLAG_ACTIVITY_NEW_TASK or
                                          Intent.FLAG_ACTIVITY_CLEAR_TOP or
                                          Intent.FLAG_ACTIVITY_SINGLE_TOP
                                      )
                                      startActivity(intent)
                                      result.success(true)
                                  } else {
                                      result.success(false)
                                  }
                              } catch (e: Exception) {
                                  result.error("BRING_APP_ERROR", e.message, null)
                              }
                          }

                          "getInstalledApps" -> {
                              result.success(getInstalledApps())
                          }

                          else -> {
                              result.notImplemented()
                          }
                      }
                  }
              }

              private fun hasUsageAccess(): Boolean {
                  val appOps =
                      getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager

                  val mode = appOps.checkOpNoThrow(
                      AppOpsManager.OPSTR_GET_USAGE_STATS,
                      Process.myUid(),
                      packageName
                  )

                  return mode == AppOpsManager.MODE_ALLOWED
              }

              private fun getInstalledApps(): List<Map<String, String>> {
                  val pm = packageManager

                  val result = mutableListOf<Map<String, String>>()
                  val seen = mutableSetOf<String>()

                  val intent = Intent(Intent.ACTION_MAIN).apply {
                      addCategory(Intent.CATEGORY_LAUNCHER)
                  }

                  val activities = pm.queryIntentActivities(
                      intent,
                      PackageManager.MATCH_ALL
                  )

                  for (info in activities) {
                      val appInfo = info.activityInfo?.applicationInfo ?: continue
                      val pkg = appInfo.packageName

                      if (pkg == packageName) continue
                      if (!seen.add(pkg)) continue

                      val label = pm.getApplicationLabel(appInfo).toString()

                      result.add(
                          mapOf(
                              "name" to label,
                              "package" to pkg,
                              "category" to appInfo.category.toString(),
                              "isGame" to (
                                  appInfo.category ==
                                      android.content.pm.ApplicationInfo.CATEGORY_GAME
                              ).toString()
                          )
                      )
                  }

                  return result.sortedBy {
                      it["name"]?.lowercase() ?: ""
                  }
              }

              private fun getForegroundPackage(): String? {
                  if (!hasUsageAccess()) return null

                  val usageStatsManager =
                      getSystemService(Context.USAGE_STATS_SERVICE)
                              as UsageStatsManager

                  val end = System.currentTimeMillis()
                  val start = end - 60_000

                  val events = usageStatsManager.queryEvents(start, end)
                  val event = UsageEvents.Event()

                  var latestPackage: String? = null
                  var latestTime = 0L

                  while (events.hasNextEvent()) {
                      events.getNextEvent(event)

                      if (event.eventType == UsageEvents.Event.MOVE_TO_FOREGROUND) {
                          if (event.timeStamp > latestTime) {
                              latestTime = event.timeStamp
                              latestPackage = event.packageName
                          }
                      }
                  }

                  return latestPackage
              }
          }
          EOF

      - name: Verify Flutter assets
        run: |
          echo "Checking onboarding assets..."
          test -f assets/images/welcome.jpg
          test -f assets/images/register.jpg
          test -f assets/images/duration.jpg
          test -f assets/images/study_time.jpg
          test -f assets/images/apps.jpg
          grep -q "assets/images/" pubspec.yaml
          echo "All onboarding assets are present."

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: almutafawiq-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: almutafawiq-aab
          path: build/app/outputs/bundle/release/*.aab
