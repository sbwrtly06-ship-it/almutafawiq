

name: Build AlMutafawiq APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android --org com.almutafawiq .

      - name: Add Accessibility blocking service
        run: |
          mkdir -p android/app/src/main/kotlin/com/almutafawiq/almutafawiq
          mkdir -p android/app/src/main/res/xml

          cat > android/app/src/main/kotlin/com/almutafawiq/almutafawiq/AppBlockAccessibilityService.kt <<'EOF'
          package com.almutafawiq.almutafawiq

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.view.Gravity
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.TextView

          class AppBlockAccessibilityService : AccessibilityService() {

              private var overlay: TextView? = null

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return

                  val packageName = event.packageName?.toString() ?: return
                  val prefs = getSharedPreferences("FlutterSharedPreferences", MODE_PRIVATE)

                  val focusActive =
                      prefs.getBoolean("flutter.focus_mode_active", false)

                  val blockedPackages =
                      prefs.getString("flutter.blocked_packages", "")
                          ?.split("|")
                          ?.filter { it.isNotBlank() }
                          ?.toSet()
                          ?: emptySet()

                  if (focusActive && packageName in blockedPackages) {
                      showBlockOverlay()
                  } else {
                      removeBlockOverlay()
                  }
              }

              private fun showBlockOverlay() {
                  if (overlay != null) return

                  val text = TextView(this).apply {
                      text = "🔒\n\nهذا التطبيق محظور أثناء جلسة التركيز\n\nارجع إلى الدراسة في تطبيق المتفوق"
                      textSize = 22f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.rgb(35, 25, 55))
                      gravity = Gravity.CENTER
                      setPadding(40, 40, 40, 40)
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )

                  val windowManager =
                      getSystemService(WINDOW_SERVICE) as WindowManager

                  windowManager.addView(text, params)
                  overlay = text
              }

              private fun removeBlockOverlay() {
                  val view = overlay ?: return
                  val windowManager =
                      getSystemService(WINDOW_SERVICE) as WindowManager

                  try {
                      windowManager.removeView(view)
                  } catch (_: Exception) {
                  }

                  overlay = null
              }

              override fun onInterrupt() {
                  removeBlockOverlay()
              }

              override fun onDestroy() {
                  removeBlockOverlay()
                  super.onDestroy()
              }
          }
          EOF

          cat > android/app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:accessibilityFlags="flagDefault" />
          EOF

      - name: Add Usage Access permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          text = text.replace(
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android" '
              'xmlns:tools="http://schemas.android.com/tools">'
          )

          permission = '''
              <uses-permission
                  android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />
          '''

          if "PACKAGE_USAGE_STATS" not in text:
              text = text.replace(
                  '<application',
                  permission + '\n    <application'
              )

          service = '''
              <service
                  android:name=".AppBlockAccessibilityService"
                  android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.accessibilityservice.AccessibilityService" />
                  </intent-filter>
                  <meta-data
                      android:name="android.accessibilityservice"
                      android:resource="@xml/accessibility_service_config" />
              </service>
          '''

          if "AppBlockAccessibilityService" not in text:
              text = text.replace("</application>", service + "\n    </application>")

          path.write_text(text)
          PY

      - name: Add native Usage Access bridge
        run: |
          mkdir -p android/app/src/main/kotlin/com/almutafawiq/almutafawiq

          cat > android/app/src/main/kotlin/com/almutafawiq/almutafawiq/MainActivity.kt <<'EOF'
          package com.almutafawiq.almutafawiq

          import android.app.AppOpsManager
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.os.Process
          import android.provider.Settings
          import android.app.usage.UsageEvents
          import android.app.usage.UsageStatsManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {

              private val CHANNEL = "almutafawiq/usage"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      CHANNEL
                  ).setMethodCallHandler { call, result ->

                      when (call.method) {

                          "openUsageAccessSettings" -> {
                              try {
                                  val intent = Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS)
                                  startActivity(intent)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.error("SETTINGS_ERROR", e.message, null)
                              }
                          }

                          "hasUsageAccess" -> {
                              result.success(hasUsageAccess())
                          }

                          "getForegroundPackage" -> {
                              result.success(getForegroundPackage())
                          }

                          else -> {
                              result.notImplemented()
                          }
                      }
                  }
              }

              private fun hasUsageAccess(): Boolean {
                  val appOps =
                      getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager

                  val mode = appOps.checkOpNoThrow(
                      AppOpsManager.OPSTR_GET_USAGE_STATS,
                      Process.myUid(),
                      packageName
                  )

                  return mode == AppOpsManager.MODE_ALLOWED
              }

              private fun getForegroundPackage(): String? {
                  if (!hasUsageAccess()) return null

                  val usageStatsManager =
                      getSystemService(Context.USAGE_STATS_SERVICE)
                              as UsageStatsManager

                  val end = System.currentTimeMillis()
                  val start = end - 60_000

                  val events = usageStatsManager.queryEvents(start, end)
                  val event = UsageEvents.Event()

                  var latestPackage: String? = null
                  var latestTime = 0L

                  while (events.hasNextEvent()) {
                      events.getNextEvent(event)

                      if (event.eventType == UsageEvents.Event.MOVE_TO_FOREGROUND) {
                          if (event.timeStamp > latestTime) {
                              latestTime = event.timeStamp
                              latestPackage = event.packageName
                          }
                      }
                  }

                  return latestPackage
              }
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: almutafawiq-apk
          path: build/app/outputs/flutter-apk/*.apk
